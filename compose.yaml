services:
  vpn:
    build: .
    container_name: cornell-vpn
    # Needed for mknod /dev/net/tun and for route/DNS setup by vpnc-script.
    privileged: true
    # Credentials are mounted as a file, NOT passed via `env_file`: Compose
    # interpolates `$` in env_file values, which silently corrupts passwords
    # containing `$`. A secret file is delivered to the container byte for byte.
    secrets:
      - vpn_credentials
    # entry.sh exits 0 on a rejected login so the container stays down rather
    # than replaying it - every replay fires another Duo push. The :3 cap is a
    # backstop: even if that logic ever regresses, Docker will not restart more
    # than three times, so no bug can spam pushes indefinitely overnight.
    restart: "on-failure:3"
    # Give openconnect time to tear the tunnel down cleanly on stop.
    stop_grace_period: 30s

secrets:
  vpn_credentials:
    file: ./vpn.env
